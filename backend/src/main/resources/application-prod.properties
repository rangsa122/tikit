# 외부 운영 환경 설정 파일
spring.config.import=file:./secrets.properties

# 운영 PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${PROD_DB_NAME}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

# Flyway 자동 baseline 비활성화
spring.flyway.baseline-on-migrate=false

# 운영 Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${PROD_REDIS_DATABASE}

# 로그
logging.level.root=INFO
logging.level.com.tikit=INFO

spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# JWT 키
jwt.secret=${JWT_SECRET}
jwt.refresh-cookie.secure=true

# Toss Payments
toss.base-url=https://api.tosspayments.com
toss.client-key=${TOSS_CLIENT_KEY:}
toss.secret-key=${TOSS_SECRET_KEY:}
toss.connect-timeout=3s
toss.read-timeout=10s

# KOPIS
kopis.service-key=${KOPIS_SERVICE_KEY:}
kopis.base-url=https://kopis.or.kr/openApi/restful