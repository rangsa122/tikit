spring.application.name=tikit
server.port=8080

# Flyway 공통 설정
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator 공통 설정
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# 기본값은 공용 API. 팀원은 추가 모델/VPN 설치 없이 기존 로그인 토큰으로 호출한다.
# 로컬 모델을 직접 사용하려는 호스트 개발 환경에서만 RAG_MODE=local로 변경한다.
rag.mode=${RAG_MODE:remote}
rag.remote.base-url=${RAG_REMOTE_BASE_URL:https://mhyang.taila6fdc4.ts.net}
rag.remote.connect-timeout-ms=${RAG_REMOTE_CONNECT_TIMEOUT_MS:5000}
rag.remote.read-timeout-ms=${RAG_REMOTE_READ_TIMEOUT_MS:300000}

# 아래 Ollama 설정은 로컬 실행/공용 호스트에서 사용한다.
# #23과 동일한 임베딩 모델/차원. 모델 또는 문서 변경 시 재시작해 시제품 캐시를 재생성한다.
rag.embedding.model=Qwen/Qwen3-Embedding-8B
rag.embedding.dimensions=4096
rag.embedding.api-key=${RAG_EMBEDDING_API_KEY:}
rag.ollama.base-url=${RAG_OLLAMA_BASE_URL:http://localhost:11434}
rag.ollama.connect-timeout-ms=${RAG_OLLAMA_CONNECT_TIMEOUT_MS:5000}
rag.ollama.read-timeout-ms=${RAG_OLLAMA_READ_TIMEOUT_MS:180000}
rag.ollama.batch-size=${RAG_OLLAMA_BATCH_SIZE:8}
rag.ollama.context-length=${RAG_OLLAMA_CONTEXT_LENGTH:2048}

# pgvector 마이그레이션 및 Ollama 접속을 준비한 환경에서 활성화한다.
rag.indexing.enabled=${RAG_INDEXING_ENABLED:false}
rag.indexing.batch-size=${RAG_INDEXING_BATCH_SIZE:10}
rag.indexing.poll-interval-ms=${RAG_INDEXING_POLL_INTERVAL_MS:5000}

# 코드 포인트(문자) 기준 청크 크기와 겹침. 0 <= overlap < size
rag.chunking.size=${RAG_CHUNKING_SIZE:500}
rag.chunking.overlap=${RAG_CHUNKING_OVERLAP:100}

# 검증용 청크 검색은 명시적으로 켜야 한다. 운영 DB 검색은 후속 작업이다.
rag.search.prototype-enabled=${RAG_QA_PROTOTYPE_ENABLED:false}
rag.search.top-k=${RAG_SEARCH_TOP_K:3}
rag.search.min-score=${RAG_SEARCH_MIN_SCORE:0.5}

# 답변 생성용 모델. 임베딩 모델과 구분한다.
rag.generation.model=${RAG_GENERATION_MODEL:qwen3:8b}
rag.generation.read-timeout-ms=${RAG_GENERATION_READ_TIMEOUT_MS:180000}
rag.generation.max-tokens=${RAG_GENERATION_MAX_TOKENS:512}
rag.generation.context-length=${RAG_GENERATION_CONTEXT_LENGTH:4096}
