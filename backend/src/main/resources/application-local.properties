spring.config.import=classpath:secrets.properties

# 로컬 PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${LOCAL_DB_NAME}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}

# Flyway 초기 이력 등록
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 로컬 Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${LOCAL_REDIS_DATABASE}

spring.data.redis.ssl.enabled=true
spring.data.redis.ssl.bundle=redis

spring.ssl.bundle.pem.redis.truststore.certificate=${REDIS_CA_CERT}

spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslrootcert=${DB_CA_CERT}

# 로그
logging.level.com.tikit=DEBUG

# SQL을 읽기 쉽게 출력
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# 파라미터 값 확인
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# JWT 키
jwt.secret=${JWT_SECRET}
jwt.refresh-cookie.secure=false

# Toss Payments
toss.base-url=https://api.tosspayments.com
toss.client-key=${TOSS_CLIENT_KEY:}
toss.secret-key=${TOSS_SECRET_KEY:}
toss.connect-timeout=3s
toss.read-timeout=10s

#kopis
kopis.service-key= ${KOPIS_SERVICE_KEY:}
kopis.base-url=https://www.kopis.or.kr/openApi/restful

# 예매 테스트 데이터. secrets.properties에 SEED_ENABLED=true를 넣고 서버를 켜면 공연과 회차가 생성되고 로그에 예매 주소가 찍힘
tikit.seed.enabled=${SEED_ENABLED:false}
