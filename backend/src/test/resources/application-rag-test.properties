# TEST_DB_*가 있으면 우선 사용하고, 없으면 개인 DB의 LOCAL_DB_* 설정을 사용한다.
test.datasource.url=${TEST_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${LOCAL_DB_NAME:tikit_test}}
test.datasource.username=${TEST_DB_USERNAME:${LOCAL_DB_USERNAME:postgres}}
test.datasource.password=${TEST_DB_PASSWORD:${LOCAL_DB_PASSWORD:}}
test.datasource.sslmode=${TEST_DB_SSLMODE:verify-full}
test.datasource.sslrootcert=${TEST_DB_SSLROOTCERT:${DB_CA_CERT:}}

# #23 워커 테스트도 문서 API 테스트와 같은 접속 설정을 사용한다.
rag.test.datasource.url=${test.datasource.url}
rag.test.datasource.username=${test.datasource.username}
rag.test.datasource.password=${test.datasource.password}
rag.test.datasource.sslmode=${test.datasource.sslmode}
rag.test.datasource.sslrootcert=${test.datasource.sslrootcert}
